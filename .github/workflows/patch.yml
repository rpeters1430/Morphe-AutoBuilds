name: Auto Build and Release Morphe

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      force_full_rebuild:
        description: "Rebuild every app (ignore incremental check)"
        type: boolean
        required: false
        default: false
      apps:
        description: "Only rebuild these apps (comma-separated app_name values, empty = all that changed)"
        type: string
        required: false
        default: ''
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC

# Builds and manual patches all write to the same 'latest' release; run them
# one at a time so they don't delete each other's assets.
concurrency:
  group: morphe-release
  cancel-in-progress: false

# Read-only by default; only the release job writes.
permissions:
  contents: read

jobs:
  check-updates:
    name: Check for Updates
    runs-on: ubuntu-latest
    # Store/API probes each have their own timeouts; this caps the whole check
    # well below GitHub's 6-hour default.
    timeout-minutes: 30
    outputs:
      has_updates: ${{ steps.check.outputs.has_updates }}
      build_matrix: ${{ steps.check.outputs.build_matrix }}
      update_count: ${{ steps.check.outputs.update_count }}
      total_count: ${{ steps.check.outputs.total_count }}
      carry_count: ${{ steps.check.outputs.carry_count }}
      incremental: ${{ steps.check.outputs.incremental }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Validate GitHub Auth
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/validate_github_auth.py

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Validate patch-config.json
        run: |
          python scripts/validate_config.py

      - name: Run Incremental Update Check
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_FULL_REBUILD: ${{ inputs.force_full_rebuild || 'false' }}
          ONLY_APPS: ${{ inputs.apps || '' }}
        run: |
          python scripts/check_app_updates.py

      - name: Show Plan Summary
        run: |
          echo "Total entries:   ${{ steps.check.outputs.total_count }}"
          echo "Need rebuild:    ${{ steps.check.outputs.update_count }}"
          echo "Carry over:      ${{ steps.check.outputs.carry_count }}"
          echo "Incremental:     ${{ steps.check.outputs.incremental }}"
          {
            echo "### 🗺️ Build plan"
            echo ""
            echo "| Total | Rebuild | Carry over | Incremental |"
            echo "| ---: | ---: | ---: | :---: |"
            echo "| ${{ steps.check.outputs.total_count }} | ${{ steps.check.outputs.update_count }} | ${{ steps.check.outputs.carry_count }} | ${{ steps.check.outputs.incremental }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Plan Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-plan
          path: |
            build_matrix.json
            carry_over.json
            new_manifest.json
          if-no-files-found: warn
          retention-days: 1

  patch-apps:
    name: Read Configuration
    needs: check-updates
    runs-on: ubuntu-latest
    if: needs.check-updates.outputs.has_updates == 'true'
    outputs:
      matrix: ${{ steps.read-matrix.outputs.matrix }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Build Matrix from Check
        id: read-matrix
        run: |
          MATRIX='${{ needs.check-updates.outputs.build_matrix }}'
          if [ -z "$MATRIX" ] || [ "$MATRIX" = "null" ]; then
            echo "Empty matrix from check; falling back to full patch-config.json"
            MATRIX=$(jq -c '[.patch_list[] | select(.enabled != false) | {app_name, source}] | unique' patch-config.json)
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Matrix: $MATRIX" | head -c 1000

  build-apps:
    name: Build Applications
    needs: patch-apps
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      trawl:
        image: ghcr.io/germondai/trawl:latest@sha256:c25aefa0f204d0496db9e5e530ff826ffe06f471228c5236e95862e815a9c865
        ports:
          - 8191:8191
        options: --shm-size=1gb
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.patch-apps.outputs.matrix) }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build APK
        env:
          APP_NAME: ${{ matrix.app_name }}
          SOURCE: ${{ matrix.source }}
          ARCH: ${{ matrix.arch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRAWL_URL: http://localhost:8191
        run: |
          echo "Building ${{ matrix.app_name }} with ${{ matrix.source }}..."
          sleep $((RANDOM % 30)).$((RANDOM % 100))
          
          python -m src

      - name: Record Build Outputs
        if: always()
        env:
          APP_NAME: ${{ matrix.app_name }}
          SOURCE: ${{ matrix.source }}
        run: |
          mkdir -p build_records
          # Record every produced APK so manifest can map (app, source, arch) -> filename
          for apk in *.apk; do
            [ -e "$apk" ] || continue
            # record_build.py now detects arch from filename automatically
            APK_PATH="$apk" python scripts/record_build.py || true
          done
          echo "Records produced:"
          ls -la build_records/ 2>/dev/null || echo "(no records)"

      - name: Report Failure
        if: failure()
        run: |
          {
            echo "### ❌ ${{ matrix.app_name }} (${{ matrix.source }}) failed"
            echo ""
            echo "Common fixes in \`patch-config.json\` for this entry:"
            echo "- a patch no longer matches the app: pin an older \`version\`, or set \`continue_on_error: true\` to skip that patch"
            echo "- no store has a compatible version: set \`force: true\` or \`experimental: true\`"
            echo "- the app can't be built right now: set \`enabled: false\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apk-${{ matrix.app_name }}-${{ matrix.source }}
          path: "*.apk"
          retention-days: 3

      - name: Upload Build Records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-records-${{ matrix.app_name }}-${{ matrix.source }}
          path: build_records/
          if-no-files-found: ignore

  create-single-release:
    name: Create Single Release
    needs: [check-updates, build-apps]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: always() && needs.check-updates.outputs.has_updates == 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download Build Plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-plan
          path: ./build-plan
        continue-on-error: true

      - name: Download All APK Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ./all-apks
          pattern: apk-*

      - name: Download All Build Records
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ./all-records
          pattern: build-records-*
        continue-on-error: true

      - name: Check if Any APKs Were Built
        id: check-apks
        run: |
          built_count=$(find ./all-apks -name "*.apk" 2>/dev/null | wc -l)
          echo "Built APKs: $built_count"

          if [ "$built_count" -eq 0 ]; then
            echo "❌ No rebuilt APKs available"
            echo "skip_release=true" >> $GITHUB_OUTPUT
          else
            echo "✅ $built_count rebuilt APK(s) ready for release"
            echo "skip_release=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Record Failed Builds
        # Nothing built, so nothing is released, but the manifest still has to
        # note which inputs failed; otherwise the failure backoff never starts
        # and every failing app is retried daily.
        if: steps.check-apks.outputs.skip_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f ./build-plan/new_manifest.json ]; then
            echo "No build plan; nothing to record."
            exit 0
          fi
          # A full-rebuild fallback plans an empty manifest; uploading it would
          # wipe the existing one.
          if [ "$(jq '.entries | length' ./build-plan/new_manifest.json)" -eq 0 ]; then
            echo "Build plan has no manifest entries; keeping the existing manifest."
            exit 0
          fi
          if ! gh release view latest >/dev/null 2>&1; then
            echo "No 'latest' release yet; nothing to update."
            exit 0
          fi
          cp ./build-plan/new_manifest.json ./new_manifest.json
          python scripts/merge_manifest.py
          gh release upload latest manifest.json --clobber

      - name: Collect All APKs
        if: steps.check-apks.outputs.skip_release == 'false'
        run: |
          mkdir -p ./release-apks
          echo "📦 Collecting rebuilt APKs..."
          find ./all-apks -name "*.apk" -exec cp -f {} ./release-apks/ \; 2>/dev/null || true

          echo "📁 APKs ready for release:"
          ls -la ./release-apks/

          final_count=$(ls -1 ./release-apks/*.apk 2>/dev/null | wc -l || echo "0")
          echo "📊 Total APKs: $final_count"

      - name: Build Final Manifest
        if: steps.check-apks.outputs.skip_release == 'false'
        run: |
          echo "🧾 Building manifest.json from build-plan + build records..."
          # The new_manifest.json (post-plan baseline) lives in the build-plan artifact
          if [ -f ./build-plan/new_manifest.json ]; then
            cp ./build-plan/new_manifest.json ./new_manifest.json
          fi
          # Flatten all per-build records into one directory
          mkdir -p build_records
          if [ -d ./all-records ]; then
            find ./all-records -name "*.json" -exec cp {} build_records/ \; 2>/dev/null || true
          fi
          python scripts/merge_manifest.py || {
            echo "⚠️ merge_manifest.py failed; continuing without manifest update."
            rm -f manifest.json
          }
          if [ -f manifest.json ]; then
            echo "✅ manifest.json built:"
            jq '.entries | length' manifest.json || true
            cp manifest.json ./release-apks/manifest.json
          fi

      - name: Validate GitHub Auth
        if: steps.check-apks.outputs.skip_release == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/validate_github_auth.py

      - name: Check Existing Release
        if: steps.check-apks.outputs.skip_release == 'false'
        id: check-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "✅ Release 'latest' exists; assets will be updated in place."
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
            echo "📭 Release 'latest' does not exist; it will be created."
          fi
      
      - name: Upload Or Create Release
        if: steps.check-apks.outputs.skip_release == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Publishing rebuilt assets to release..."

          apk_count=$(ls -1 ./release-apks/*.apk 2>/dev/null | wc -l || echo "0")
          if [ $apk_count -eq 0 ]; then
            echo "❌ No APKs found to release"
            exit 1
          fi

          echo "📦 Releasing $apk_count APK(s)..."

          # Build the asset list: APKs + optional manifest.json
          ASSETS=( ./release-apks/*.apk )
          if [ -f ./release-apks/manifest.json ]; then
            ASSETS+=( ./release-apks/manifest.json )
            echo "📎 Including manifest.json"
          fi

          if [ "${{ steps.check-release.outputs.release_exists }}" = "true" ]; then
            # Upload first, then delete superseded versions: if the upload
            # fails, the previous APKs are still there to download.
            echo "⬆️ Uploading rebuilt assets in place..."
            gh release upload latest "${ASSETS[@]}" --clobber

            # APK names embed the version, so --clobber never replaces an older
            # version (v2.4.0 next to the new v2.5.0). cleanup_old_apks.py deletes
            # any release APK sharing an {app}-{arch}-{name} identity with a new
            # APK but with a different version.
            : > keep_apks.txt
            for apk in ./release-apks/*.apk; do
              [ -f "$apk" ] || continue
              basename "$apk" >> keep_apks.txt
            done
            python scripts/cleanup_old_apks.py --release latest --keep-file keep_apks.txt || \
              echo "⚠️  cleanup_old_apks.py failed; superseded APKs may remain"
          else
            echo "🆕 Creating 'latest' release..."
            gh release create "latest" \
              --title "Morphe APKs - $(date +'%Y-%m-%d %H:%M')" \
              --notes "Publishing..." \
              "${ASSETS[@]}" \
              --latest
          fi

          echo "✅ Release publish step completed successfully!"

      - name: Update Release Notes
        if: steps.check-apks.outputs.skip_release == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Listed after upload + cleanup so the notes match what is actually
          # attached (no superseded versions, nothing missing).
          gh release view latest --json assets --jq '.assets[].name' | sort -u > release_assets.txt

          cat > release_notes.md << 'EOF'
          # Morphe APKs - Auto Built
          
          ## 📱 Available Apps
          
          EOF

          while read -r filename; do
            [ -n "$filename" ] || continue
            echo "- $filename" >> release_notes.md
          done < release_assets.txt

          cat >> release_notes.md << 'EOF'
          ---
          
          ## ⚙️ Build Information
          - **Auto-built daily at 6 AM UTC**
          - **Multiple architecture support** (arm64-v8a, armeabi-v7a, universal)
          - **Latest Morphe patches**
          - **Updated automatically**
          
          ## 📊 Architecture Guide
          - **arm64-v8a**: Modern ARM devices (2014+)
          - **armeabi-v7a**: Older ARM devices
          - **universal**: All ARM devices (larger file)
          
          ## ⚠️ Disclaimer
          These APKs are built automatically. Use at your own risk.
          
          ## 🔄 Update Schedule
          - Automatic updates daily at 6 AM UTC
          - Manual updates available via workflow dispatch
          - Creates `latest` if missing and uploads rebuilt assets in place
          EOF

          gh release edit latest \
            --title "Morphe APKs - $(date +'%Y-%m-%d %H:%M')" \
            --notes-file release_notes.md

      - name: Display Release URL
        if: steps.check-apks.outputs.skip_release == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_url=$(gh release view latest --json url --jq .url)
          echo "🔗 Release URL: $release_url"
          echo ""
          echo "📦 Direct Download Links:"
          {
            echo "### 📦 Released to [latest]($release_url)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          for apk in ./release-apks/*.apk; do
            filename=$(basename "$apk")
            echo "- $filename: $release_url/download/$filename"
            echo "- [$filename]($release_url/download/$filename)" >> "$GITHUB_STEP_SUMMARY"
          done

  cleanup:
    name: Cleanup Workflow Runs
    needs: [build-apps, create-single-release]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      actions: write
    steps:
      - name: Delete Old Workflow Runs
        uses: Mattraks/delete-workflow-runs@0cf693bc9909e5e867ee8f27b813224ba862939c # v2
        with:
          retain_days: 14
          keep_minimum_runs: 5
