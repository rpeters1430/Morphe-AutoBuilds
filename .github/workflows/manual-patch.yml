name: Manual Patch and Update

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App name (from apps/ folder)'
        required: true
        type: string
        default: 'youtube'
      source:
        description: 'Patch source (from sources/ folder; empty = the one set in patch-config.json)'
        required: false
        type: string
        default: ''
      version:
        description: 'Specific app version (empty = newest compatible)'
        required: false
        type: string
        default: ''
      architecture:
        description: 'Architecture to build (configured = arches from patch-config.json)'
        required: false
        type: choice
        options:
          - configured
          - arm64-v8a
          - armeabi-v7a
          - universal
        default: 'configured'
      patches_channel:
        description: 'Patches release channel (default = as set in patch-config.json)'
        required: false
        type: choice
        options:
          - default
          - stable
          - prerelease
          - dev
          - source
        default: 'default'
      patches_tag:
        description: 'Exact patches release tag (overrides patches_channel, e.g. v1.2.0-dev.3)'
        required: false
        type: string
        default: ''
      cli_channel:
        description: 'CLI release channel (default = as set in patch-config.json)'
        required: false
        type: choice
        options:
          - default
          - stable
          - prerelease
          - dev
          - source
        default: 'default'
      experimental:
        description: 'Allow experimental app versions (Morphe only)'
        required: false
        type: choice
        options:
          - default
          - 'true'
          - 'false'
        default: 'default'
      force:
        description: 'Patch the newest store version even if not listed as compatible (--force)'
        required: false
        type: choice
        options:
          - default
          - 'true'
          - 'false'
        default: 'default'
      continue_on_error:
        description: 'Skip patches that fail instead of aborting (--continue-on-error)'
        required: false
        type: choice
        options:
          - default
          - 'true'
          - 'false'
        default: 'default'
      include_patches:
        description: 'Extra patches to enable (comma-separated names)'
        required: false
        type: string
        default: ''
      exclude_patches:
        description: 'Extra patches to disable (comma-separated names)'
        required: false
        type: string
        default: ''
      replace_in_release:
        description: 'Replace APK in existing release'
        required: true
        type: boolean
        default: true

concurrency:
  group: morphe-release
  cancel-in-progress: false

jobs:
  manual-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      trawl:
        image: ghcr.io/germondai/trawl:latest@sha256:c25aefa0f204d0496db9e5e530ff826ffe06f471228c5236e95862e815a9c865
        ports:
          - 8191:8191
        options: --shm-size=1gb
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      
      - name: Resolve Source
        id: resolve
        env:
          APP_NAME: ${{ inputs.app_name }}
          SOURCE_INPUT: ${{ inputs.source }}
        run: |
          source="$SOURCE_INPUT"
          if [ -z "$source" ]; then
            source=$(jq -r --arg app "$APP_NAME" \
              'first(.patch_list[] | select(.app_name == $app) | .source) // empty' patch-config.json)
          fi
          if [ -z "$source" ]; then
            echo "::error::'$APP_NAME' is not in patch-config.json; pass a source explicitly"
            exit 1
          fi
          if [ ! -f "sources/$source.json" ]; then
            echo "::error::sources/$source.json does not exist"
            exit 1
          fi
          echo "Using source: $source"
          echo "source=$source" >> "$GITHUB_OUTPUT"

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt
      
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: '25'
      
      - name: Build APK
        env:
          APP_NAME: ${{ inputs.app_name }}
          SOURCE: ${{ steps.resolve.outputs.source }}
          ARCH: ${{ inputs.architecture != 'configured' && inputs.architecture || '' }}
          PATCHES_CHANNEL: ${{ inputs.patches_tag || inputs.patches_channel }}
          CLI_CHANNEL: ${{ inputs.cli_channel }}
          EXPERIMENTAL: ${{ inputs.experimental }}
          FORCE_PATCH: ${{ inputs.force }}
          CONTINUE_ON_ERROR: ${{ inputs.continue_on_error }}
          INCLUDE_PATCHES: ${{ inputs.include_patches }}
          EXCLUDE_PATCHES: ${{ inputs.exclude_patches }}
          APP_VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRAWL_URL: http://localhost:8191
        run: |
          echo "🔧 Building $APP_NAME with $SOURCE (${{ inputs.architecture }})..."
          python -m src
      
      - name: Find Built APK
        id: find-apk
        run: |
          # Find the built APK file(s)
          apk_files=$(ls -1 *.apk 2>/dev/null)
          if [ -z "$apk_files" ]; then
            echo "❌ No APK files found"
            exit 1
          fi
          
          # Fix for multi-line output in GitHub Actions
          {
            echo "apk_files<<EOF"
            echo "$apk_files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          
          echo "apk_count=$(echo "$apk_files" | wc -l)" >> "$GITHUB_OUTPUT"
          
          # Print for debugging
          echo "Found these APKs:"
          echo "$apk_files"
      
      - name: Upload as Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: manual-apk-${{ inputs.app_name }}-${{ inputs.architecture }}
          path: "*.apk"
      
      - name: Check Existing Release
        if: ${{ inputs.replace_in_release == true }}
        id: check-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            echo "✅ Release 'latest' exists"
            echo "release_exists=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Release 'latest' does not exist"
            echo "release_exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Update Release
        if: ${{ inputs.replace_in_release == true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔄 Updating release efficiently..."
          
          # 1. GENERATE FILE LIST FOR NOTES
          # We fetch the list of names via API so the release notes remain accurate
          # without needing to download the actual heavy APK files.
          if [ "${{ steps.check-release.outputs.release_exists }}" == "true" ]; then
            gh release view latest --json assets --jq '.assets[].name' > current_assets.txt
          else
            touch current_assets.txt
          fi
          
          # Add the new APK name(s) to the text file
          for apk in *.apk; do
            echo "$apk" >> current_assets.txt
          done
          
          # 2. CREATE RELEASE NOTES
          cat > release_notes.md << EOF
          # Morphe APKs
          
          ## 📱 Available Apps
          EOF
          
          # Sort and use 'unique' to remove duplicates in the text list
          sort -u current_assets.txt | while read filename; do
            echo "- $filename" >> release_notes.md
          done
          
          cat >> release_notes.md << EOF
          
          ---
          
          **Last Update:** $(date)
          **Updated App:** ${{ inputs.app_name }}
          **Architecture:** ${{ inputs.architecture }}
          **Source:** ${{ steps.resolve.outputs.source }}
          
          Auto-updates daily at 6 AM UTC.
          EOF
          
          # 3. PERFORM UPDATE (CLOBBER) OR CREATE
          if [ "${{ steps.check-release.outputs.release_exists }}" == "true" ]; then
            echo "⬆️ Uploading new assets (clobbering existing)..."

            # Delete superseded older-version APKs for this app/arch before upload.
            # --clobber only overwrites exact filenames; since APK names embed the
            # version, the old version (e.g. v2.4.0) would otherwise remain next
            # to the new v2.5.0. cleanup_old_apks.py removes any release APK that
            # shares a {app}-{arch}- prefix with a freshly built APK but has a
            # different version.
            : > keep_apks.txt
            for apk in *.apk; do
              [ -f "$apk" ] || continue
              echo "$apk" >> keep_apks.txt
            done
            python scripts/cleanup_old_apks.py --release latest --keep-file keep_apks.txt || \
              echo "⚠️  cleanup_old_apks.py failed; continuing with clobber upload"

            # --clobber overwrites the file if it exists, adds it if it doesn't
            gh release upload latest *.apk --clobber

            echo "📝 Updating release title and notes..."
            gh release edit latest \
              --title "Morphe APKs - $(date +'%Y-%m-%d %H:%M')" \
              --notes-file release_notes.md
              
          else
            echo "🚀 Creating new release..."
            gh release create "latest" \
              --title "Morphe APKs - $(date +'%Y-%m-%d %H:%M')" \
              --notes-file release_notes.md \
              *.apk \
              --latest
          fi
          
          echo "✅ Release updated successfully!"
      
      - name: Show Download Links
        if: ${{ inputs.replace_in_release == true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_url=$(gh release view latest --json url --jq .url)
          echo "🔗 Updated Release URL: $release_url"
          echo ""
          echo "📦 Direct APK links:"
          for apk in *.apk; do
            echo "  - $release_url/download/$apk"
          done
      
