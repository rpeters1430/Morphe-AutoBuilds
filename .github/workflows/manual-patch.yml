name: Manual Patch and Update

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App name (from apps/ folder)'
        required: true
        type: string
        default: 'youtube'
      source:
        description: 'Patch source (from sources/ folder; empty = the one set in patch-config.json)'
        required: false
        type: string
        default: ''
      version:
        description: 'Specific app version (empty = newest compatible)'
        required: false
        type: string
        default: ''
      architecture:
        description: 'Architecture to build (configured = arches from patch-config.json)'
        required: false
        type: choice
        options:
          - configured
          - arm64-v8a
          - armeabi-v7a
          - universal
        default: 'configured'
      patches_channel:
        description: 'Patches release channel (default = as set in patch-config.json)'
        required: false
        type: choice
        options:
          - default
          - stable
          - prerelease
          - dev
          - source
        default: 'default'
      patches_tag:
        description: 'Exact patches release tag (overrides patches_channel, e.g. v1.2.0-dev.3)'
        required: false
        type: string
        default: ''
      cli_channel:
        description: 'CLI release channel (default = as set in patch-config.json)'
        required: false
        type: choice
        options:
          - default
          - stable
          - prerelease
          - dev
          - source
        default: 'default'
      experimental:
        description: 'Allow experimental app versions (Morphe only)'
        required: false
        type: choice
        options:
          - default
          - 'true'
          - 'false'
        default: 'default'
      force:
        description: 'Patch the newest store version even if not listed as compatible (--force)'
        required: false
        type: choice
        options:
          - default
          - 'true'
          - 'false'
        default: 'default'
      continue_on_error:
        description: 'Skip patches that fail instead of aborting (--continue-on-error)'
        required: false
        type: choice
        options:
          - default
          - 'true'
          - 'false'
        default: 'default'
      include_patches:
        description: 'Extra patches to enable (comma-separated names)'
        required: false
        type: string
        default: ''
      exclude_patches:
        description: 'Extra patches to disable (comma-separated names)'
        required: false
        type: string
        default: ''
      replace_in_release:
        description: 'Replace APK in existing release'
        required: true
        type: boolean
        default: true

concurrency:
  group: morphe-release
  cancel-in-progress: false

jobs:
  manual-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      trawl:
        image: ghcr.io/germondai/trawl:latest@sha256:cfa32f8d6ce5df7d3916d6b014aeeb61256342197b992bd7151ea70e180e3c8f
        ports:
          - 8191:8191
        options: --shm-size=1gb
      # Cloudflare solver for stores behind a challenge (APKFab).
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
        ports:
          - 8192:8191
        options: --shm-size=1gb
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      
      - name: Resolve Source
        id: resolve
        env:
          APP_NAME: ${{ inputs.app_name }}
          SOURCE_INPUT: ${{ inputs.source }}
        run: |
          source="$SOURCE_INPUT"
          if [ -z "$source" ]; then
            source=$(jq -r --arg app "$APP_NAME" \
              'first(.patch_list[] | select(.app_name == $app) | .source) // empty' patch-config.json)
          fi
          if [ -z "$source" ]; then
            echo "::error::'$APP_NAME' is not in patch-config.json; pass a source explicitly"
            exit 1
          fi
          if [ ! -f "sources/$source.json" ]; then
            echo "::error::sources/$source.json does not exist"
            exit 1
          fi
          echo "Using source: $source"
          echo "source=$source" >> "$GITHUB_OUTPUT"

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: requirements.txt
      
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: 'temurin'
          java-version: '25'
      
      # Patch lists earlier builds saw, so new patches stay turned on.
      - name: Download Release Manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download latest --pattern manifest.json --dir patch-state || true

      - name: Build APK
        env:
          PATCH_STATE_FILE: patch-state/manifest.json
          APP_NAME: ${{ inputs.app_name }}
          SOURCE: ${{ steps.resolve.outputs.source }}
          ARCH: ${{ inputs.architecture != 'configured' && inputs.architecture || '' }}
          PATCHES_CHANNEL: ${{ inputs.patches_tag || inputs.patches_channel }}
          CLI_CHANNEL: ${{ inputs.cli_channel }}
          EXPERIMENTAL: ${{ inputs.experimental }}
          FORCE_PATCH: ${{ inputs.force }}
          CONTINUE_ON_ERROR: ${{ inputs.continue_on_error }}
          INCLUDE_PATCHES: ${{ inputs.include_patches }}
          EXCLUDE_PATCHES: ${{ inputs.exclude_patches }}
          APP_VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRAWL_URL: http://localhost:8191
          FLARESOLVERR_URL: http://localhost:8192/v1
        run: |
          echo "🔧 Building $APP_NAME with $SOURCE (${{ inputs.architecture }})..."
          python -m src
      
      - name: Collect Verified Outputs
        if: always()
        run: python scripts/collect_verified_apks.py

      - name: Find Built APK
        id: find-apk
        run: |
          # Find the built APK file(s)
          apk_files=$(ls -1 verified-apks/*.apk 2>/dev/null)
          if [ -z "$apk_files" ]; then
            echo "❌ No APK files found"
            exit 1
          fi
          
          # Fix for multi-line output in GitHub Actions
          {
            echo "apk_files<<EOF"
            echo "$apk_files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          
          echo "apk_count=$(echo "$apk_files" | wc -l)" >> "$GITHUB_OUTPUT"
          
          # Print for debugging
          echo "Found these APKs:"
          echo "$apk_files"
      
      - name: Upload as Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: manual-apk-${{ inputs.app_name }}-${{ inputs.architecture }}
          path: verified-apks/*
          retention-days: 3
      
      - name: Check Existing Release
        if: ${{ inputs.replace_in_release == true }}
        id: check-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            echo "✅ Release 'latest' exists"
            echo "release_exists=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Release 'latest' does not exist"
            echo "release_exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Update Release
        id: publish
        if: ${{ inputs.replace_in_release == true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_NAME: ${{ inputs.app_name }}
          ARCH_INPUT: ${{ inputs.architecture }}
          SOURCE: ${{ steps.resolve.outputs.source }}
        run: |
          echo "🔄 Updating release efficiently..."

          # 1. UPLOAD IMMUTABLE ASSETS OR CREATE
          if [ "${{ steps.check-release.outputs.release_exists }}" == "true" ]; then
            # Upload first, then delete superseded versions: if the upload
            # fails, the previous APKs are still there to download.
            echo "⬆️ Uploading immutable assets..."
            python scripts/upload_apks.py verified-apks/*

          else
            echo "🚀 Creating new release..."
            gh release create "latest" \
              --title "Morphe APKs - $(date +'%Y-%m-%d %H:%M')" \
              --notes "Publishing..." \
              verified-apks/* \
              --latest
          fi

      - name: Record Build in Manifest
        id: record-manifest
        # Lets the daily run know about this APK: a build with the configured
        # settings counts as up to date; one with overrides is kept until the
        # patches or settings change.
        if: ${{ always() && inputs.replace_in_release == true }}
        env:
          BUILD_PUBLISHED: ${{ steps.publish.outcome == 'success' }}
          APP_NAME: ${{ inputs.app_name }}
          SOURCE: ${{ steps.resolve.outputs.source }}
          PATCHES_CHANNEL: ${{ inputs.patches_tag || inputs.patches_channel }}
          CLI_CHANNEL: ${{ inputs.cli_channel }}
          EXPERIMENTAL: ${{ inputs.experimental }}
          FORCE_PATCH: ${{ inputs.force }}
          CONTINUE_ON_ERROR: ${{ inputs.continue_on_error }}
          INCLUDE_PATCHES: ${{ inputs.include_patches }}
          EXCLUDE_PATCHES: ${{ inputs.exclude_patches }}
          APP_VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/record_manual_build.py

      - name: Remove Superseded APKs
        if: ${{ success() && steps.record-manifest.outputs.manifest_updated == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          : > keep_apks.txt
          for apk in verified-apks/*.apk; do
            [ -f "$apk" ] || continue
            basename "$apk" >> keep_apks.txt
          done
          python scripts/cleanup_old_apks.py --release latest --keep-file keep_apks.txt

      - name: Update Release Notes
        if: ${{ always() && steps.publish.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_NAME: ${{ inputs.app_name }}
          ARCH_INPUT: ${{ inputs.architecture }}
          SOURCE: ${{ steps.resolve.outputs.source }}
        run: |
          # 2. RELEASE NOTES
          # Listed after upload + cleanup so the notes match what is actually
          # attached (no superseded versions, nothing missing).
          gh release view latest --json assets --jq '.assets[].name' | sort -u > release_assets.txt

          cat > release_notes.md << EOF
          # Morphe APKs
          
          ## 📱 Available Apps
          EOF

          while read -r filename; do
            [ -n "$filename" ] || continue
            echo "- $filename" >> release_notes.md
          done < release_assets.txt

          cat >> release_notes.md << EOF
          
          ---
          
          **Last Update:** $(date)
          **Updated App:** ${APP_NAME}
          **Architecture:** ${ARCH_INPUT}
          **Source:** ${SOURCE}
          
          Auto-updates daily at 6 AM UTC.
          EOF

          echo "📝 Updating release title and notes..."
          gh release edit latest \
            --title "Morphe APKs - $(date +'%Y-%m-%d %H:%M')" \
            --notes-file release_notes.md

          echo "✅ Release updated successfully!"


      - name: Show Download Links
        if: ${{ inputs.replace_in_release == true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_url=$(gh release view latest --json url --jq .url)
          echo "🔗 Updated Release URL: $release_url"
          echo ""
          echo "📦 Direct APK links:"
          for apk in verified-apks/*.apk; do
            echo "  - $release_url/download/$(basename "$apk")"
          done
      
