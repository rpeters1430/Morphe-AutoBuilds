name: Deploy App Catalog to GitHub Pages

# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# (Or add a PAGES_ENABLEMENT_TOKEN secret: a fine-grained PAT with
# Administration + Pages write on this repo, and this workflow enables Pages itself.)

on:
  # Releases made by the build workflows use GITHUB_TOKEN, and events created
  # with GITHUB_TOKEN don't start other workflows. Refresh after each build instead.
  workflow_run:
    workflows:
      - Auto Build and Release Morphe
      - Manual Patch and Update
    types: [completed]
  release:
    types: [published, edited]
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'patch-config.json'
      - 'apps/**'
      - 'sources/**'
      - 'scripts/generate_portal_data.py'
      - '.github/workflows/deploy-portal.yml'

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  check-trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Did the Triggering Run Touch the Release?
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          deploy=true
          if [ "$EVENT" = "workflow_run" ]; then
            # A cancelled or skipped build changed nothing worth republishing.
            if [ "$CONCLUSION" != "success" ] && [ "$CONCLUSION" != "failure" ]; then
              deploy=false
            # The daily build succeeds even when nothing needed rebuilding; then
            # its release job is skipped and there is nothing new to show.
            elif [ "$WORKFLOW" = "Auto Build and Release Morphe" ]; then
              release_job=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
                --jq '.jobs[] | select(.name == "Create Single Release") | .conclusion' 2>/dev/null || echo "unknown")
              if [ "$release_job" = "skipped" ]; then
                deploy=false
              fi
            fi
          fi
          echo "Deploy: $deploy"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  deploy-portal:
    needs: check-trigger
    if: needs.check-trigger.outputs.deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check GitHub Pages Is Enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_ENABLEMENT_TOKEN: ${{ secrets.PAGES_ENABLEMENT_TOKEN != '' }}
        run: |
          if build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>api_error.txt); then
            if [ "$build_type" != "workflow" ]; then
              echo "::error title=GitHub Pages source is '${build_type}'::Set Settings -> Pages -> Build and deployment -> Source to 'GitHub Actions', then re-run this workflow."
              exit 1
            fi
            echo "GitHub Pages is enabled (source: GitHub Actions)."
          elif ! grep -q "HTTP 404" api_error.txt; then
            echo "::warning::Could not read the Pages settings ($(cat api_error.txt)); trying to deploy anyway."
          elif [ "$HAS_ENABLEMENT_TOKEN" = "true" ]; then
            echo "GitHub Pages is not enabled yet; configure-pages will enable it with PAGES_ENABLEMENT_TOKEN."
          else
            {
              echo "### ❌ GitHub Pages is not enabled for this repository"
              echo ""
              echo "1. Open **Settings → Pages** (https://github.com/${GITHUB_REPOSITORY}/settings/pages)"
              echo "2. Under **Build and deployment → Source**, choose **GitHub Actions**"
              echo "3. Re-run this workflow"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=GitHub Pages is not enabled::Open Settings -> Pages and set Source to 'GitHub Actions', then re-run this workflow. See the run summary for the link."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Refresh Catalog Data from Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_portal_data.py

      - name: Setup GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: ${{ secrets.PAGES_ENABLEMENT_TOKEN != '' }}
          token: ${{ secrets.PAGES_ENABLEMENT_TOKEN || github.token }}

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
